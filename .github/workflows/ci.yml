name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel previous runs on the same ref when a new push arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # pnpm/action-setup v4.1.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version contract
        run: pnpm version:check

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Crash-injection models (release gate)
        run: pnpm test:crash-models

      - name: Release pipeline tests
        run: pnpm test:release

      - name: Distribution channel pointers
        run: pnpm release:worker:validate-pointers

      - name: Worker e2e (real workerd / DO / R2)
        run: pnpm --filter @kuroflare/worker test:e2e
