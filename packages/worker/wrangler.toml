name = "kuroflare-worker"
main = "src/index.ts"
compatibility_date = "2026-06-12"

[[durable_objects.bindings]]
name = "VAULT_ROOM"
class_name = "VaultRoom"

# wrangler.toml has no field for R2 lifecycle rules; they're bucket-level config
# applied out of band via `wrangler r2 bucket lifecycle` (see its --help for the
# exact flags on the wrangler version in use). The DO's own alarm-driven sweep
# (see blobs.ts) is only best-effort for an otherwise-idle vault, so also
# apply an "abort incomplete multipart uploads after ~24h" rule on
# kuroflare-snapshots once per environment, so stray sessions are reclaimed
# even if the DO never wakes up again.
[[r2_buckets]]
binding = "SNAPSHOT_BUCKET"
bucket_name = "kuroflare-snapshots"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VaultRoom"]

# Uncomment to override the default minimum retained snapshot generation
# count (3, packages/worker/src/runtime/constants.ts). Must be a positive
# integer string; an invalid value fails closed (blocks retention cleanup
# instead of silently falling back to the default — see docs/spec/server.md
# §8 and docs/deployment.md).
# [vars]
# SNAPSHOT_RETENTION_MIN_GENERATIONS = "3"
